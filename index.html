<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jeopardy</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ========================= -->
    <!-- INICIO -->
    <!-- ========================= -->

    <section id="startScreen" class="screen active">

        <h1 class="logo">JEOPARDY</h1>

        <p>¿Están listos?</p>

        <button id="startButton" class="main-button">
            JUGAR
        </button>

        <button id="resumeButton" class="secondary-button hidden">
            CONTINUAR PARTIDA
        </button>

    </section>


    <!-- ========================= -->
    <!-- CONFIGURACIÓN -->
    <!-- ========================= -->

    <section id="setupScreen" class="screen">

        <h2>CONFIGURACIÓN</h2>

        <p>¿Cuántos equipos van a jugar?</p>

        <div class="team-count-buttons">

            <button class="team-count" data-count="1">1</button>

            <button class="team-count" data-count="2">2</button>

            <button class="team-count" data-count="3">3</button>

            <button class="team-count" data-count="4">4</button>

        </div>

        <div id="teamNames"></div>

        <button id="beginGameButton" class="main-button hidden">
            COMENZAR
        </button>

    </section>


    <!-- ========================= -->
    <!-- TABLERO -->
    <!-- ========================= -->

    <section id="gameScreen" class="screen">

        <header class="game-header">

            <h2 id="roundTitle">
                RONDA 1
            </h2>

            <button id="resetButton" class="secondary-button">
                Reiniciar
            </button>

        </header>


        <div id="scoreboard" class="scoreboard"></div>


        <div id="board" class="board"></div>


        <button id="continueButton"
                class="main-button hidden continue-button">

            CONTINUAR

        </button>

    </section>


    <!-- ========================= -->
    <!-- PREGUNTA -->
    <!-- ========================= -->

    <section id="questionScreen" class="screen">

        <div class="question-info">

            <span id="questionCategory"></span>

            <span id="questionValue"></span>

        </div>


        <div class="question-content">

            <!-- TEXTO DE PREGUNTA -->

            <h2 id="questionText"
                class="question-media hidden">
            </h2>


            <!-- IMAGEN DE PREGUNTA -->

            <img id="questionImage"
                 class="question-image question-media hidden"
                 alt="Imagen de pregunta">


            <!-- AUDIO DE PREGUNTA -->

            <div id="questionAudioContainer"
                 class="audio-question question-media hidden">

                <button id="playAudioButton"
                        class="audio-play-button">

                    ▶ REPRODUCIR AUDIO

                </button>

                <audio id="questionAudio"></audio>

            </div>


            <!-- RESPUESTA -->

            <div id="answerContainer"
                 class="answer-container hidden">

                <p class="answer-label">
                    RESPUESTA
                </p>


                <!-- TEXTO RESPUESTA -->

                <h3 id="answerText"
                    class="answer-media hidden">
                </h3>


                <!-- IMAGEN RESPUESTA -->

                <img id="answerImage"
                     class="answer-image answer-media hidden"
                     alt="Imagen de respuesta">

            </div>

        </div>


        <button id="showAnswerButton"
                class="main-button">

            MOSTRAR RESPUESTA

        </button>


        <button id="returnBoardButton"
                class="secondary-button hidden">

            VOLVER AL TABLERO

        </button>

    </section>


    <!-- ========================= -->
    <!-- ENTRE RONDAS -->
    <!-- ========================= -->

    <section id="roundSummaryScreen" class="screen">

        <h2 id="summaryTitle">
            FIN DE LA RONDA 1
        </h2>

        <div id="summaryScores"
             class="summary-scores">
        </div>

        <button id="nextRoundButton"
                class="main-button">

            IR A RONDA 2

        </button>

    </section>


    <!-- ========================= -->
    <!-- RESULTADOS -->
    <!-- ========================= -->

    <section id="finalScreen" class="screen">

        <h2>
            RESULTADOS FINALES
        </h2>

        <div id="finalScores"
             class="summary-scores">
        </div>

        <button id="newGameButton"
                class="main-button">

            NUEVA PARTIDA

        </button>

    </section>


    <script src="js/questions.js"></script>

    <script src="js/game.js"></script>

</body>

</html>
